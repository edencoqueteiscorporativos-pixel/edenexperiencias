/* ÉDEN — Identidade clean, editorial e minimalista */
:root{
  font-family:'Montserrat',Arial,Helvetica,sans-serif;
  --navy:#233d54;--ink:#273b4b;--cream:#faf9f6;--sand:#f0eae3;
  --tan:#d8c4b1;--line:#ebe7e0;--muted:#89919a;
  --shadow:none;
  font-synthesis:none;color:var(--ink);background:#faf9f7;
}
body,button,input,select,textarea{font-family:'Montserrat',Arial,Helvetica,sans-serif}
body{font-weight:400;letter-spacing:-.015em}
button,input,select,textarea{font-weight:400}
.layout{grid-template-columns:250px minmax(0,1fr)}
.sidebar{background:#f7f5f1;color:var(--ink);border-right:1px solid #e9e6df;padding:39px 17px 20px}
.brand{margin:0 10px 29px;padding:0 8px 25px;border-color:#e3ded6}
.brand-name{font-family:'Montserrat',Arial,sans-serif;font-size:29px;letter-spacing:.17em;font-weight:400;line-height:1.18;color:#233e56}
.brand-point{color:#c8aa91;font-size:24px;letter-spacing:0}
.brand-sub{font-size:7.6px;letter-spacing:.88px;line-height:1.65;font-weight:500;margin-top:8px;color:#9d9289;white-space:nowrap}
.nav-section{margin:16px 15px 9px;color:#aea39a;letter-spacing:1.5px;font-size:9px;font-weight:500}
.nav-btn{color:#72808b;font-size:11px;font-weight:450;margin:2px 0;border-radius:8px;padding:11px 12px;gap:13px;letter-spacing:-.01em}
.nav-btn:hover{background:#efeae4;color:var(--navy)}
.nav-btn.active{background:#ebe6df;color:var(--navy);font-weight:600}
.nav-icon{width:17px;height:18px;display:flex;flex:0 0 17px;align-items:center;justify-content:center;color:#8e9a9f}
.nav-icon svg{width:17px;height:17px;stroke-width:1.45}
.nav-btn.active .nav-icon{color:var(--navy)}
.sidebar-foot{border-color:#e7e2dc;color:#998f83;padding:18px 12px 5px;font-size:10px;line-height:1.6}
.sidebar-foot strong{color:#425666;font-weight:500;font-size:10px}
.small-link{color:#727f87;text-decoration:none;font-weight:500;line-height:1.8}
.small-link:hover{text-decoration:underline}
.main{background:#fbfaf8}
.topbar{min-height:98px;border-color:#efeae5;background:#fbfaf8;padding:24px 44px}
.top-eyebrow{font-size:9px;color:#a99a8b;font-weight:500;letter-spacing:1.55px}
.top-title{font-family:'Montserrat',Arial,sans-serif;font-size:21px;font-weight:450;letter-spacing:-.9px;color:#344d5d;margin:7px 0 0}
.top-right{color:#979c9d;font-size:11px;gap:15px}
.local-chip{background:transparent;border:1px solid #e9e0d5;color:#9a8f82;font-size:9px;font-weight:500;padding:8px 10px}
.avatar{background:#f0e8de;border:1px solid #e7ddcf;box-shadow:none;color:#4b6775;width:35px;height:35px;font-weight:500;font-size:12px}
.content{max-width:1520px;padding:32px 44px 62px}
.hero{border-radius:12px;min-height:184px;padding:31px 35px;background:#f2ede6;color:#263d4f;border:1px solid #ece4db;box-shadow:none;gap:18px}
.hero:before{display:none}
.hero .pill{background:transparent;color:#ae9983;letter-spacing:2.15px;padding:0;font-size:9px;font-weight:500}
.hero h1{font-family:'Montserrat',Arial,sans-serif;font-size:clamp(24px,2.5vw,33px);font-weight:300;letter-spacing:-1.35px;line-height:1.26;max-width:550px;margin:13px 0 11px}
.hero p{font-size:10.5px;line-height:1.7;color:#83909a;font-weight:400;max-width:580px}
.btn{border-radius:7px;min-height:39px;font-size:10.5px;font-weight:500;padding:10px 15px;letter-spacing:.04px;background:#294459;transition:background .15s ease,transform .15s ease}
.btn:hover{filter:none;background:#1f3548}
.btn-light{background:#2b475d;color:#fff;border-color:#2b475d}
.btn-light:hover{background:#21384b}
.btn-soft{background:#efede9;color:#526577}
.btn-soft:hover{background:#e7e2db;color:#2d4458}
.btn-outline{border:1px solid #dfdcd7;color:#526576;background:#fff}
.btn-danger{background:#f9f0eb;color:#9e685e}
.btn-xs{min-height:28px;font-size:10px}
.metrics{gap:12px;margin:16px 0}
.metric{border:1px solid #eee9e3;border-radius:10px;box-shadow:none;padding:17px 19px;background:#fff}
.metric:hover{transform:none;border-color:#d8cbc0}
.metric .meta{color:#949a9e;font-size:10px;font-weight:450;margin-bottom:17px}
.metric .value{font-family:'Montserrat',Arial,sans-serif;font-size:clamp(18px,1.8vw,25px);font-weight:400;letter-spacing:-1px;color:#294156}
.metric .hint{font-size:9.5px;color:#a6aaa9;margin-top:9px}
.mini-symbol{height:24px;width:24px;border-radius:50%;background:#f6f2ed;color:#9b8e81;font-weight:400;font-size:13px}
.columns-2{gap:14px}
.panel{border-radius:10px;padding:22px 22px;background:#fff;border:1px solid #eee9e3;box-shadow:none}
.panel-top h3{font-weight:500;font-size:12px;color:#405568}
.panel-top small{font-weight:400}
.list-row{padding:13px 0;border-color:#f2eee9}
.list-row strong{font-weight:500;font-size:11px}
.list-row span{font-size:10.5px}
.row-action{font-weight:500;font-size:10.5px;color:#6b818c}
.badge{border-radius:5px;font-weight:500;font-size:9px;padding:5px 8px}
.badge.ok{color:#6a8070;background:#edf2ed}
.badge.warn{color:#a18050;background:#f8f3e9}
.badge.danger{color:#b47168;background:#f9f0ef}
.badge.muted{color:#8e8b86;background:#f2efeb}
.toolbar{margin:24px 0 16px}
.toolbar h2,.section-heading{font-family:'Montserrat',Arial,sans-serif;font-size:20px;font-weight:400;letter-spacing:-.65px;color:#34495b}
.toolbar p{font-size:11px;color:#97a0a7}
input,select,textarea{min-height:42px;border:1px solid #e6e3de;border-radius:7px;font-size:11px;padding:11px 12px;color:#344b5c}
input:focus,select:focus,textarea:focus{border-color:#b2a28e;box-shadow:0 0 0 3px #e9e0d455}
label{font-size:10.5px;font-weight:500;color:#647582;letter-spacing:0}
.data-wrap,.calendar{border-radius:10px;border-color:#ede9e4}
table.data thead{background:#faf9f6}
table.data th{font-weight:500;letter-spacing:.9px;padding:14px 17px;font-size:9px;color:#979fa3}
table.data td{font-size:11px;padding:13px 17px}
table.data td strong{font-weight:500;color:#405565}
.lane{background:#f3f0eb;border-radius:10px;border-color:#ece7e0;min-height:415px}
.lane header{font-weight:500;font-size:10.5px;color:#657580}
.count{background:#e5ded6;font-weight:500}
.kanban-card{box-shadow:none;border-color:#ebe8e3;border-radius:8px;padding:14px}
.kanban-card strong{font-weight:500;color:#3e5262;font-size:11px}
.kanban-card p,.kanban-card .card-footer{font-size:10px;font-weight:450}
.detail-tile{border-radius:9px;padding:18px}
.detail-tile strong{font-family:'Montserrat',Arial,sans-serif;font-size:19px;font-weight:400}
.calendar-title{font-family:'Montserrat',Arial,sans-serif;font-size:19px;font-weight:400;letter-spacing:-.6px}
.cal-days div{font-weight:500}
.cal-event{background:#f1ece5;color:#476274}
.cal-cell.today .cal-num{border-radius:5px}
.modal-back{background:rgba(29,42,50,.48);backdrop-filter:blur(5px)}
.modal{border-radius:12px;box-shadow:0 25px 75px #1c2f3d26}
.modal-head h2{font-family:'Montserrat',Arial,sans-serif;font-size:20px;font-weight:400;letter-spacing:-.55px}
.icon-close{border-radius:50%;background:#f5f2ee;font-size:17px}
.auth-left{background:#344b5d}
.auth-left:after{display:none}
.auth-mark{font-family:'Montserrat',Arial,sans-serif;font-size:46px;font-weight:300;letter-spacing:7px}
.auth-left h1{font-family:'Montserrat',Arial,sans-serif;font-size:39px;font-weight:300;letter-spacing:-2px;line-height:1.3}
.auth-card h2{font-family:'Montserrat',Arial,sans-serif;font-size:29px;font-weight:400}
.startup{font-family:'Montserrat',Arial,sans-serif;font-weight:300;font-size:40px;letter-spacing:.18em}
.startup small{font-family:'Montserrat',Arial,sans-serif;font-size:9px;letter-spacing:1.8px}
.sub-tabs button{font-size:10px;font-weight:500;border-radius:7px}
.sub-tabs button.active{background:#294559;border-color:#294559}
.recipe-card{border-radius:9px}
.recipe-card h3{font-family:'Montserrat',Arial,sans-serif;font-weight:400;font-size:17px}
.doc-sheet{color:#344b5d;box-shadow:none}
.doc-brand{font-family:'Montserrat',Arial,sans-serif;font-size:32px;font-weight:300;letter-spacing:6px}
.doc-brand small{display:block;font-size:8px;font-weight:500;letter-spacing:2px;margin-top:9px}
.doc-sheet h1{font-family:'Montserrat',Arial,sans-serif;font-size:28px;font-weight:350;letter-spacing:-1.25px}
.doc-sheet .doc-item strong{font-family:'Montserrat',Arial,sans-serif;font-size:15px;font-weight:500}
.empty .symbol{font-family:'Montserrat',Arial,sans-serif;font-size:25px;font-weight:300}
.footer-note{font-size:9px;line-height:1.8}
.mini-chart-row .bar i{background:#c9b6a2}
#toast .notice{background:#344b5d;border-radius:8px;font-weight:400}
@media(max-width:1160px){.layout{grid-template-columns:215px minmax(0,1fr)}.content{padding:28px 25px 50px}.topbar{padding:20px 25px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
  .layout{display:block}.sidebar{position:relative;height:auto;min-height:0;padding:15px 16px 0;border-right:0;border-bottom:1px solid #e9e4de}
  .brand{border-bottom:0;margin:0;padding:5px 3px 15px}.brand-name{font-size:23px}.brand-sub{font-size:7px;margin-top:5px}
  .nav-wrap{gap:3px;overflow-x:auto}.nav-btn{padding:10px 11px;font-size:10px;white-space:nowrap}.nav-btn .nav-icon{width:15px;height:15px}.nav-icon svg{height:15px;width:15px}
  .topbar{min-height:76px;padding:16px 20px}.top-title{font-size:18px}.top-eyebrow{font-size:8px;letter-spacing:1px}.top-right .date{display:none}.avatar{display:none}
  .content{padding:18px 15px 40px}.hero{padding:26px 23px;display:block;min-height:0}.hero h1{font-size:27px;line-height:1.24}.hero p{font-size:10px}.hero .btn{margin-top:20px}
  .metrics{margin:12px 0;gap:9px}.metric{padding:15px 13px}.metric .value{font-size:18px}.metric .meta{font-size:9px;margin-bottom:12px}.metric .hint{font-size:8.5px}
  .toolbar{margin:22px 0 13px}.toolbar h2{font-size:18px}.panel{padding:17px}.list-row strong{font-size:10px}
  .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-tile strong{font-size:15px}
  .local-chip{font-size:8px;padding:7px 8px}.modal{max-height:calc(100dvh - 16px)}
  .auth-left h1{font-size:29px}.auth-mark{font-size:35px}
}
@media(max-width:370px){.metrics{grid-template-columns:1fr 1fr}.hero h1{font-size:24px}.topbar{padding:13px}.local-chip{font-size:7px}}
@media print{.doc-sheet{box-shadow:none;border:0}.doc-sheet h1{font-size:26px}}
@media(max-width:760px){.metric .meta{font-size:10px}.metric .hint{font-size:9px}.panel-top h3{font-size:11px}.nav-btn{font-size:11px}.list-row span{font-size:10px}.footer-note{font-size:9px}.hero .pill{font-size:9px}}

.sidebar .brand{padding:0 0 18px;margin:0 4px 23px}
.sidebar .eden-logo{width:100%;max-width:215px;margin:0 auto}
.startup .eden-logo{width:270px;max-width:70vw}
.auth-mark .eden-logo{width:240px;max-width:80%}
.doc-brand .eden-logo{width:225px;max-width:100%;height:auto;margin:0 0 14px}
@media(max-width:760px){.sidebar .brand{padding:0 3px 13px;margin:0}.sidebar .eden-logo{width:145px;margin:0}.doc-brand .eden-logo{width:185px}}


/* ÉDEN MOBILE — operabilidade, leitura e ergonomia (v3). */
.eden-bottom-nav,.eden-sheet-backdrop,.eden-mobile-funnel,.eden-mobile-calendar{display:none}
/* A logo original é azul-marinho; o fundo claro evita perda de contraste no login. */
.auth-left{background:#f1e8df!important;color:#2d4557!important}
.auth-left h1{color:#314b5e!important}
.auth-left small{color:#867e75!important}
@media(max-width:760px){
 html{scroll-padding-top:88px}body{overflow-x:hidden}
 .layout{min-width:0}.main{min-width:0}
 .sidebar{position:sticky;top:0;z-index:30;background:rgba(250,248,245,.98);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:8px 17px;border-bottom:1px solid #e9e2dc;box-shadow:0 2px 15px #26394905}
 .sidebar .brand{display:flex;align-items:center;justify-content:center;padding:0!important;margin:0!important;min-height:47px}
 .sidebar .eden-logo{width:126px!important;height:auto;margin:auto!important}
 .sidebar .nav-wrap,.sidebar .sidebar-foot{display:none!important}
 .topbar{min-height:54px;padding:10px 18px;border-bottom:0;gap:10px}
 .top-title{font-size:17px;letter-spacing:-.55px;margin-top:1px}
 .top-eyebrow{font-size:8px;letter-spacing:1px}
 .topbar .top-right{flex-shrink:0}.topbar .top-right .cloud-chip{font-size:0!important;padding:0!important;width:8px;height:8px;border:0;border-radius:50%;background:#98a99e}
 .topbar .top-right .cloud-chip:first-letter{font-size:0}
 .topbar .logout-top{display:none!important}
 .content{padding:10px 15px calc(114px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
 .hero{padding:24px 22px;border-radius:12px;margin-bottom:15px}.hero h1{font-size:26px}.hero .btn{min-height:44px}
 .metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}
 .metric{padding:15px 12px;min-height:103px}.metric .value{font-size:clamp(15px,4.4vw,20px);line-height:1.22;letter-spacing:-.65px;overflow-wrap:anywhere}
 .metric .meta{gap:5px;font-size:10px}.metric .hint{font-size:9.5px;line-height:1.45}
 .columns-2{grid-template-columns:1fr;gap:12px}.panel{padding:16px}.list-row{gap:9px}
 .toolbar{align-items:stretch;gap:12px;margin:16px 0 13px}.toolbar h2{font-size:19px;line-height:1.3}.toolbar p{line-height:1.55;font-size:10px;margin-top:5px}
 .toolbar>.button-group{display:flex;width:100%;gap:8px}.toolbar>.button-group>.btn{flex:1 1 130px;white-space:normal;line-height:1.3}
 .btn{min-height:44px;padding:11px 14px;font-size:11px}.btn-xs{min-height:40px}
 .row-action{min-height:34px;padding:7px 8px}.list-right .row-action{min-height:32px}
 .filters{gap:9px}.filters input,.filters select{max-width:100%;flex:1 1 100%;font-size:16px}
 .filters>.btn{flex:1}.sub-tabs{display:flex;overflow-x:auto;flex-wrap:nowrap;gap:7px;scroll-snap-type:x proximity;padding:2px 0 10px;margin-bottom:11px}
 .sub-tabs button{white-space:nowrap;flex:0 0 auto;min-height:42px;scroll-snap-align:start;font-size:11px}
 input,select,textarea{min-height:46px;font-size:16px!important;max-width:100%}
 input[type=checkbox],input[type=radio]{min-height:20px;width:20px;flex:0 0 20px}
 .form-grid{grid-template-columns:1fr!important}.form-grid .field{grid-column:1/-1!important;min-width:0}

     if(permitted){await loadAll();listenRealtime()}else renderAccessDenied();
   }else{state.user=null;renderAuth()}
   // Reage a encerramentos e trocas de conta; evita requisições Supabase dentro do callback.
   state.db.auth.onAuthStateChange((evt,session)=>{
     if(!authReady)return;

       removeRealtime();state.user=null;state.data={};state.modal=null;photoCache.clear();renderAuth();
     }
     if(evt==='SIGNED_IN'&&session?.user?.id!==state.user?.id){
       setTimeout(()=>authorizeAndLoad(session.user),0);
     }
   });

 }catch(error){

 }

/* Fotografia de preparação: arquivo privado no Supabase Storage, nunca base64 no banco.
   photo_url guarda o caminho permanente; a URL assinada é temporária e não persistida. */
function isStoragePhoto(path){return typeof path==='string' && /^receitas\/[0-9a-f-]{36}\/[a-zA-Z0-9_.-]+\.(?:webp|jpg|jpeg|png)$/i.test(path)}
function photoDisplayUrl(r){
 const p=String(r?.photo_url||'');
 if(isStoragePhoto(p))return photoCache.get(p)?.src||'';
 return /^https:\/\//i.test(p)?p:''; // Somente links legados https, caso existam.
}
function photoCardHtml(r,cls='recipe-cover'){
 const src=photoDisplayUrl(r);
 return src?`<img class="${cls}" src="${esc(src)}" loading="lazy" alt="Fotografia de ${esc(r.name)}">`:
 `<div class="${cls} recipe-cover-empty"><span aria-hidden="true">✳</span><small>Sem fotografia</small></div>`;
}
async function ensureRecipePhotos(){
 if(!state.db?.storage||!state.user)return;
 const paths=[...new Set(get('recipes').map(r=>r.photo_url).filter(isStoragePhoto))];
 const now=Date.now();
 const missing=paths.filter(p=>!photoCache.has(p)||photoCache.get(p).expiry<now);
 if(!missing.length)return;
 for(let start=0;start<missing.length;start+=40){
   const portion=missing.slice(start,start+40);
   try{
     const {data,error}=await state.db.storage.from(PHOTO_BUCKET).createSignedUrls(portion,3600);
     if(error)throw error;
     for(const item of data||[]){
       if(item?.signedUrl && portion.includes(item.path))photoCache.set(item.path,{src:item.signedUrl,expiry:Date.now()+50*60*1000});
     }
   }catch(err){console.warn('Éden: fotos indisponíveis — confira o SQL 03 (Storage):',err?.message||err)}
 }
}
function makeUUID(){
 if(crypto.randomUUID)return crypto.randomUUID();
 const a=new Uint8Array(16);crypto.getRandomValues(a);a[6]=(a[6]&15)|64;a[8]=(a[8]&63)|128;
 return [...a].map((x,i)=>[4,6,8,10].includes(i)?'-'+x.toString(16).padStart(2,'0'):x.toString(16).padStart(2,'0')).join('');
}
function clearTemporaryPhoto(){if(temporaryPhotoUrl){URL.revokeObjectURL(temporaryPhotoUrl);temporaryPhotoUrl=null}}
async function optimizedPhoto(file){
 if(!file)throw Error('Escolha uma imagem.');
 if(file.size>30*1024*1024)throw Error('A imagem original não pode ultrapassar 30 MB.');
 if(!file.type.startsWith('image/')&&!/\.(heic|heif|jpg|jpeg|png|webp|avif)$/i.test(file.name))throw Error('Escolha uma imagem válida.');
 // Reduz arquivos grandes de celular antes do upload (lado maior 1600 px).
 const url=URL.createObjectURL(file);
 try{
   const img=new Image();img.decoding='async';img.src=url;
   try{await img.decode()}catch(e){throw Error('Este formato de foto não pôde ser aberto no navegador. Tente JPG, PNG ou WebP.');}
   const ratio=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
   if(!img.naturalWidth||!img.naturalHeight)throw Error('A imagem está vazia ou corrompida.');
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));
   const ctx=canvas.getContext('2d');if(!ctx)throw Error('Não foi possível preparar a fotografia.');
   ctx.drawImage(img,0,0,canvas.width,canvas.height);
   let mime='image/webp';
   let blob=await new Promise(resolve=>canvas.toBlob(resolve,mime,.83));
   if(!blob||blob.type!=='image/webp'){mime='image/jpeg';blob=await new Promise(resolve=>canvas.toBlob(resolve,mime,.82))}
   if(!blob)throw Error('Não foi possível comprimir a fotografia.');
   if(blob.size>5*1024*1024)throw Error('A foto ficou maior que 5 MB. Selecione uma versão menor.');
   return {blob,mime,extension:mime==='image/webp'?'webp':'jpg'};
 }finally{URL.revokeObjectURL(url)}
}

const EDEN_PROPOSAL_TERMS='Cada detalhe da proposta é pensado para atender às necessidades do evento e proporcionar uma experiência gastronômica prática e agradável. As preparações são desenvolvidas em porções individuais, no estilo finger food.\n\nA montagem e a apresentação dos itens podem ser realizadas com as travessas do acervo da Éden ou com as peças disponibilizadas pelo cliente, conforme sua preferência e o estilo do evento. Mesas, toalhas, pratos, talheres e decoração não estão inclusos nesta proposta. As peças pertencentes à Éden serão recolhidas ao término do evento. Em caso de extravio ou dano, poderá ser cobrado o valor de reposição.';
const EDEN_PROPOSAL_TAGLINE='Uma seleção de sabores pensada para receber bem.';
const escapeAttr=esc;
function quoteStart(recipeId='',proposalId=''){
 state.proposalId=proposalId||null;state.proposalPreselected=recipeId||'';
 state.view='quote_builder';state.modal=null;state.mobilePanel=null;state.search='';
 window.scrollTo({top:0,behavior:'instant'});render();
}
const EDEN_PRICE_PREFIX='[EDEN_PRICE_LABEL]';
function proposalPriceText(menu){const n=String(menu?.notes||'');return n.startsWith(EDEN_PRICE_PREFIX)?n.slice(EDEN_PRICE_PREFIX.length):'';}
function proposalPriceDisplay(menu){return proposalPriceText(menu)?esc(proposalPriceText(menu)):money(menu?.price);}
function proposalBuilder(){
 const existing=state.proposalId?one('menus',state.proposalId):null;
 const linked=existing?get('menu_items').filter(i=>i.menu_id===existing.id):[];
 const pickedIds=new Set(linked.map(i=>i.recipe_id));if(state.proposalPreselected)pickedIds.add(state.proposalPreselected);
 const names=get('clients').map(c=>`<option value="${esc(c.id)}" ${existing?.client_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
 const events=get('events').map(e=>`<option value="${esc(e.id)}" ${existing?.event_id===e.id?'selected':''}>${esc(e.name)} · ${dstr(e.event_date)}</option>`).join('');
 const catPriority={'Menu salgado':0,'Menu doce':1,'Bebida':2};
 const recipes=[...get('recipes')].sort((a,b)=>(catPriority[a.category]??9)-(catPriority[b.category]??9)||a.name.localeCompare(b.name));
 const preparacoes=recipes.map((r,i)=>{
   const selected=pickedIds.has(r.id),item=linked.find(x=>x.recipe_id===r.id);
   return `<label class="proposal-recipe ${selected?'selected':''}" data-quote-category="${proposalCategory(r)}" data-quote-search="${escapeAttr(r.name+' '+(r.description||'')+' '+(r.pdf_description||''))}"><input type="checkbox" name="quote_recipe" value="${esc(r.id)}" ${selected?'checked':''}><span class="proposal-recipe-img">${photoCardHtml(r,'proposal-thumb')}</span><span class="proposal-recipe-copy"><small>${esc(r.category||'Preparação')}</small><strong>${esc(r.name)}</strong><span>${esc(r.description||'Fotografia e descrição da preparação.')}</span></span><span class="proposal-recipe-portion">Porções<input type="number" name="quote_portions_${esc(r.id)}" min="1" max="100000" step="1" value="${esc(item?.portions||existing?.guests||20)}" aria-label="Porções de ${esc(r.name)}"></span></label>`;
 }).join('');
 const c=existing?.client_display|| (existing?.client_id?label('clients',existing.client_id):'');
 const field=(caption,input)=>`<div class="field"><label>${caption}</label>${input}</div>`;
 return `<div class="proposal-workspace">
 <div class="proposal-page-heading"><div><div class="top-eyebrow">PROPOSTA COMERCIAL · ÉDEN</div><h2>${existing?'Editar orçamento':'Criar orçamento personalizado'}</h2><p>Uma proposta completa para o cliente. Este módulo não altera fichas técnicas nem registra pagamentos.</p></div><button class="btn btn-outline" data-action="proposal-back">← Voltar aos orçamentos</button></div>
 <form id="quote-form" class="proposal-builder-form">
 <section class="proposal-section"><div class="proposal-section-title"><span>01</span><div><h3>Cliente e encontro</h3><p>Dados que aparecerão na capa e no documento.</p></div></div>
 <div class="form-grid">
 ${field('Título interno do orçamento *',`<input name="name" required maxlength="180" placeholder="Coquetel de boas-vindas" value="${escapeAttr(existing?.name||'')}">`)}
 ${field('Cliente cadastrado (opcional)',`<select name="client_id" id="proposal-client"><option value="">Sem vínculo</option>${names}</select>`)}
 ${field('Nome do cliente para a proposta *',`<input name="client_display" required maxlength="180" placeholder="Ex.: ORO CASA / SIMONETTO" value="${escapeAttr(c)}">`)}
 ${field('Serviço',`<select name="service_type">${[['Coquetel corporativo','Coquetel corporativo'],['Reunião corporativa','Reunião corporativa'],['Coffee break','Coffee break'],['Recepção empresarial','Recepção empresarial'],['Evento social','Evento social'],['Experiência gastronômica','Experiência gastronômica']].map(([v,l])=>`<option value="${v}" ${v===(existing?.service_type||'Coquetel corporativo')?'selected':''}>${l}</option>`).join('')}</select>`)}
 ${field('Data do evento',`<input name="event_date" type="date" value="${escapeAttr(existing?.event_date||'')}">`)}
 ${field('Horário do evento (opcional)',`<input name="event_time" type="time" value="${escapeAttr((existing?.event_time||'').slice(0,5))}">`)}
 ${field('Local do evento (opcional)',`<input name="venue" maxlength="180" placeholder="Endereço ou nome do espaço" value="${escapeAttr(existing?.venue||'')}">`)}
 ${field('Evento já cadastrado (opcional)',`<select name="event_id" id="proposal-event"><option value="">Nenhum</option>${events}</select>`)}
 </div></section>
 <section class="proposal-section"><div class="proposal-section-title"><span>02</span><div><h3>Cardápio e fotografias</h3><p>Selecione as receitas prontas. Fotos, nomes e descrições virão automaticamente da biblioteca.</p></div><div id="quote-selected-count" class="proposal-count">${pickedIds.size} selecionada(s)</div></div>
 ${recipes.length?`<div class="proposal-catalog-tools"><div class="proposal-catalog-search"><label for="quote-search">Pesquisar preparações</label><div class="proposal-search-box"><span aria-hidden="true">⌕</span><input id="quote-search" type="search" placeholder="Buscar pelo nome ou descrição..." aria-label="Pesquisar preparações" autocomplete="off"></div></div><div class="proposal-catalog-filters" role="group" aria-label="Filtrar preparações por categoria"><button type="button" class="proposal-category-filter active" data-action="quote-filter" data-category="all" aria-pressed="true">Todos <span>${recipes.length}</span></button>${[['salgado','Menu salgado'],['doce','Menu doce'],['bebida','Bebidas']].map(([key,title])=>`<button type="button" class="proposal-category-filter" data-action="quote-filter" data-category="${key}" aria-pressed="false">${title} <span>${recipes.filter(r=>proposalCategory(r)===key).length}</span></button>`).join('')}</div><div id="quote-filter-results" class="proposal-filter-results" aria-live="polite">${recipes.length} preparações disponíveis</div></div><div class="proposal-recipe-list" id="quote-recipe-list">${preparacoes}</div><div id="quote-no-results" class="proposal-empty proposal-no-results" hidden>Nenhuma preparação encontrada. Tente outra categoria ou pesquisa.</div>`:`<div class="proposal-empty">Nenhuma receita cadastrada ainda. <button type="button" class="btn btn-outline" data-action="open" data-type="recipes">＋ Cadastrar receita</button></div>`}
 </section>
 <section class="proposal-section"><div class="proposal-section-title"><span>03</span><div><h3>Investimento e condições</h3><p>Esses dados aparecem na última página do PDF. Nenhum custo interno será mostrado.</p></div></div>
 <div class="form-grid">
 ${field('Número de convidados *',`<input name="guests" type="number" min="1" max="100000" required value="${num(existing?.guests||20)}">`)}
 ${field('Valor da proposta (R$ ou texto) *',`<input name="price_display" type="text" maxlength="80" required value="${escapeAttr(existing?(proposalPriceText(existing)||String(existing.price||'')):'' )}" placeholder="Ex.: 850,00 · A definir · Verificar · Oferta"><small>Para valores numéricos, informe apenas o número (ex.: 850,00). Textos não entram nos cálculos financeiros.</small>`)}
 ${field('Data de emissão',`<input name="issued_on" type="date" value="${escapeAttr(existing?.issued_on||today())}">`)}
 ${field('Validade (dias)',`<input name="valid_days" type="number" min="1" max="365" step="1" value="${num(existing?.valid_days||30)}">`)}
 <div class="field wide"><label>Frase da capa</label><textarea name="description" rows="2">${esc(existing?.description||EDEN_PROPOSAL_TAGLINE)}</textarea></div>
 <div class="field wide"><label>Informações importantes / condições comerciais</label><textarea name="terms" rows="7">${esc(existing?.terms||EDEN_PROPOSAL_TERMS)}</textarea></div>
 <div class="field wide"><label>Mensagem de encerramento</label><input name="closing_message" maxlength="250" value="${escapeAttr(existing?.closing_message||'Será um prazer fazer parte deste encontro.')}"></div>
 </div>
 <div class="proposal-builder-foot"><p>É um orçamento comercial: salvar não cria uma conta a receber nem confirma a contratação.</p><button type="submit" class="btn">${existing?'Salvar alterações e visualizar PDF':'Salvar orçamento e visualizar PDF'} →</button></div>
 </section>
 </form></div>`;
}
function quoteSearchNormalize(v){
 return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').trim();
}
function updateQuoteRecipeFilters(category){
 const form=document.getElementById('quote-form');if(!form)return;
 const list=form.querySelector('#quote-recipe-list');if(!list)return;
 if(category)list.dataset.category=category;
 const active=list.dataset.category||'all';
 const search=quoteSearchNormalize(form.querySelector('#quote-search')?.value);
 const words=search.split(/\s+/).filter(Boolean);
 let count=0;
 list.querySelectorAll('.proposal-recipe').forEach(card=>{
  const text=quoteSearchNormalize(card.dataset.quoteSearch||'');
  const visible=(active==='all'||card.dataset.quoteCategory===active)&&words.every(w=>text.includes(w));
  card.hidden=!visible;
  if(visible)count++;
 });
 form.querySelectorAll('.proposal-category-filter').forEach(btn=>{
  const on=btn.dataset.category===active;
  btn.classList.toggle('active',on);
  btn.setAttribute('aria-pressed',String(on));
 });
 const msg=form.querySelector('#quote-filter-results');
 if(msg)msg.textContent=count+' preparaç'+(count===1?'ão encontrada':'ões encontradas')+(active!=='all'||search?' com este filtro':'');
 const noResults=form.querySelector('#quote-no-results');if(noResults)noResults.hidden=count!==0;
}
async function saveQuote(form){
 const fd=new FormData(form),ids=[...new Set(fd.getAll('quote_recipe').map(String))];
 if(!ids.length)throw Error('Escolha pelo menos uma receita para o cardápio.');
 const guests=Number(fd.get('guests')),rawPrice=String(fd.get('price_display')||'').trim(),days=Number(fd.get('valid_days'));
 const numericPrice=/^(?:R\$\s*)?[0-9][0-9.,]*$/.test(rawPrice);
 const normalizedPrice=rawPrice.replace(/R\$\s*/i,'').replace(/\s/g,'').replace(/\.(?=\d{3}(?:[,.]|$))/g,'').replace(',','.');
 const price=numericPrice?Number(normalizedPrice):0;
 if(!rawPrice)throw Error('Informe um valor ou texto como A definir, Verificar ou Oferta.');
 if(!Number.isSafeInteger(guests)||guests<1||guests>100000)throw Error('Informe corretamente o número de convidados.');
 if(!Number.isFinite(price)||price<0)throw Error('Confira o valor comercial informado.');
 if(!Number.isSafeInteger(days)||days<1||days>365)throw Error('A validade deve ser de 1 a 365 dias.');
 const name=String(fd.get('name')||'').trim(),clientDisplay=String(fd.get('client_display')||'').trim();
 if(name.length<3||clientDisplay.length<2)throw Error('Informe o nome do orçamento e do cliente.');
 const rows=ids.map((recipe_id,i)=>{
   if(!one('recipes',recipe_id))throw Error('Uma receita selecionada não existe mais.');
   const portions=Number(fd.get('quote_portions_'+recipe_id));
   if(!Number.isSafeInteger(portions)||portions<1||portions>100000)throw Error('Confira as porções de '+label('recipes',recipe_id));
   return {recipe_id,portions,sort_order:i};
 });
 let client_id=String(fd.get('client_id')||'')||null,event_id=String(fd.get('event_id')||'')||null;
 if(event_id){const event=one('events',event_id);if(!event)throw Error('Evento não encontrado.');if(event.client_id&&client_id&&event.client_id!==client_id)throw Error('Cliente e evento vinculados não correspondem.');client_id=client_id||event.client_id||null;}
 const payload={name,client_id,event_id,client_display:clientDisplay,service_type:String(fd.get('service_type')||'Coquetel corporativo'),event_date:String(fd.get('event_date')||'')||null,event_time:String(fd.get('event_time')||'')||null,venue:String(fd.get('venue')||''),guests,price,notes:numericPrice?'':EDEN_PRICE_PREFIX+rawPrice,issued_on:String(fd.get('issued_on')||'')||today(),valid_days:days,description:String(fd.get('description')||''),terms:String(fd.get('terms')||''),closing_message:String(fd.get('closing_message')||''),status:'rascunho'};
 let id=state.proposalId;
 if(id){
  const {error}=await state.db.from('menus').update(payload).eq('id',id);if(error)throw error;
  const old=get('menu_items').filter(i=>i.menu_id===id);
  for(const item of rows){const existing=old.find(x=>x.recipe_id===item.recipe_id);
   if(existing){const {error}=await state.db.from('menu_items').update({portions:item.portions,sort_order:item.sort_order}).eq('id',existing.id);if(error)throw error;}
   else{const {error}=await state.db.from('menu_items').insert({...item,menu_id:id});if(error)throw error;}}
  for(const stale of old.filter(x=>!rows.some(i=>i.recipe_id===x.recipe_id))){const {error}=await state.db.from('menu_items').delete().eq('id',stale.id);if(error)throw error;}
 }else{
  const {data,error}=await state.db.from('menus').insert({...payload,version:1}).select('id').single();if(error)throw error;
  id=data?.id;if(!id)throw Error('Erro ao criar proposta.');
  const {error:err}=await state.db.from('menu_items').insert(rows.map(x=>({...x,menu_id:id})));
  if(err){await state.db.from('menus').delete().eq('id',id);throw Error('Não foi possível associar as receitas. '+err.message);}
 }
 await loadAll();state.proposalId=id;state.view='proposal_preview';state.modal=null;
 window.scrollTo({top:0,behavior:'instant'});render();toast('Orçamento salvo. Confira a prévia comercial e gere o PDF.');
}
function proposalItems(menu){return get('menu_items').filter(i=>i.menu_id===menu.id).sort((a,b)=>num(a.sort_order)-num(b.sort_order));}
function proposalPageFooter(n,total){return `<div class="pdf-footer"><span>ÉDEN / EXPERIÊNCIAS GASTRONÔMICAS</span><span>${String(n).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span></div>`;}
function proposalCategory(recipe){
 const c=String(recipe?.category||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
 if(c.includes('salgado'))return 'salgado';
 if(c.includes('doce'))return 'doce';
 if(c.includes('bebida'))return 'bebida';
 return 'outros';
}
function proposalPagesHTML(menu){
 const entries=proposalItems(menu);
 // Keep categories on different pages; up to ten preparations per A4 cardápio page.
 const groups=[['salgado','MENU SALGADO'],['doce','MENU DOCE'],['bebida','BEBIDAS'],['outros','OUTRAS PREPARAÇÕES']];
 const chunks=[];
 groups.forEach(([category,title])=>{
  const list=entries.map((item,index)=>({item,index,recipe:one('recipes',item.recipe_id)})).filter(x=>proposalCategory(x.recipe)===category);
  for(let i=0;i<list.length;i+=10)chunks.push({title,items:list.slice(i,i+10)});
 });
 if(!chunks.length)chunks.push({title:'CARDÁPIO',items:[]});
 const total=chunks.length+2,client=menu.client_display||label('clients',menu.client_id),service=menu.service_type||'Coquetel corporativo',guests=num(menu.guests);
 const logo='<span class="eden-logo" role="img" aria-label="Éden Experiências Gastronômicas"></span>';
 let html=`<section class="proposal-pdf-page proposal-pdf-cover"><div class="pdf-brand">${logo}</div><div class="pdf-cover-center"><div class="pdf-label">PROPOSTA COMERCIAL</div><div class="pdf-rule"></div><h1>${esc(client)}</h1><div class="pdf-service">${esc(service)}</div><p class="pdf-intro">${esc(menu.description||EDEN_PROPOSAL_TAGLINE)}</p><div class="pdf-rule"></div><strong class="pdf-guests">${guests} convidados</strong>${menu.event_date?`<div class="pdf-date">${dstr(menu.event_date)}${menu.event_time?' · '+esc(menu.event_time.slice(0,5)):''}</div>`:''}${menu.venue?`<div class="pdf-venue">${esc(menu.venue)}</div>`:''}</div>${proposalPageFooter(1,total)}</section>`;
 chunks.forEach((group,idx)=>{
  const n=idx+2,count=group.items.length;
  const density=count>=9?'pdf-density-10':count>=7?'pdf-density-8':count>=5?'pdf-density-6':'pdf-density-standard';
  html+=`<section class="proposal-pdf-page proposal-pdf-menu ${density}"><div class="pdf-brand">${logo}</div><div class="pdf-menu-heading">${esc(group.title)}</div><div class="pdf-menu-client">${esc(client)}</div><div class="pdf-menu-list">${group.items.map(({recipe:r,index})=>{
   return `<div class="pdf-menu-item"><div class="pdf-food-photo">${photoCardHtml(r,'pdf-item-photo')}</div><div class="pdf-food-copy"><small>${String(index+1).padStart(2,'0')}</small><h3>${esc(r?.name||'Preparação gastronômica')}</h3>${String(r?.pdf_description||'').trim()?`<p class="pdf-only-description">${esc(String(r.pdf_description).trim())}</p>`:''}</div></div>`;
  }).join('')||'<div class="pdf-no-items">Preparações a definir.</div>'}</div><div class="pdf-illustrative">Imagens ilustrativas</div>${proposalPageFooter(n,total)}</section>`;
 });
 html+=`<section class="proposal-pdf-page proposal-pdf-investment"><div class="pdf-brand">${logo}</div><div class="pdf-invest-heading">INVESTIMENTO</div><p class="pdf-invest-client">Proposta comercial / ${esc(client)}</p><div class="pdf-invest-top"><h2>Experiência gastronômica</h2><p>Cardápio preparado para ${guests} convidados</p><div class="pdf-rule"></div><div class="pdf-label">INVESTIMENTO TOTAL</div><strong class="pdf-invest-amount">${proposalPriceDisplay(menu)}</strong><small>Para ${guests} convidados</small></div><div class="pdf-conditions"><div class="pdf-label">INFORMAÇÕES IMPORTANTES</div><p>${esc(menu.terms||EDEN_PROPOSAL_TERMS)}</p><div class="pdf-validity">Validade do orçamento: ${num(menu.valid_days||30)} dias a partir da emissão${menu.issued_on?' ('+dstr(menu.issued_on)+')':''}.</div></div><div class="pdf-goodbye">${esc(menu.closing_message||'Será um prazer fazer parte deste encontro.')}</div>${proposalPageFooter(total,total)}</section>`;
 return `<div class="proposal-pdf-document">${html}</div>`;
}
function proposalPreview(){
 const menu=one('menus',state.proposalId);if(!menu)return `${section('Propostas comerciais','Selecione um orçamento existente.',`<button class="btn" data-action="proposal-back">Voltar</button>`)}`;
 return `<div class="proposal-workspace"><div class="proposal-page-heading"><div><div class="top-eyebrow">VISUALIZAÇÃO COMERCIAL · SEM CUSTOS INTERNOS</div><h2>Proposta para ${esc(menu.client_display||label('clients',menu.client_id))}</h2><p>${num(menu.guests)} convidados · ${proposalPriceDisplay(menu)} · ${menu.event_date?dstr(menu.event_date):'Data a definir'}</p></div><div class="proposal-preview-actions"><button class="btn btn-outline" data-action="proposal-back">← Todos</button><button class="btn btn-outline" data-action="proposal-edit" data-id="${menu.id}">Editar orçamento</button><button class="btn" data-action="print-menu" data-id="${menu.id}">↓ Gerar PDF</button></div></div><div class="proposal-pdf-preview">${proposalPagesHTML(menu)}</div><div class="proposal-pdf-help">Ao clicar em <strong>Gerar PDF</strong>, escolha <strong>Salvar como PDF</strong> na tela de impressão. O nome sugerido será <strong>Éden &amp; Nome do Cliente.pdf</strong>. Ative “gráficos de plano de fundo” para manter o fundo bege da identidade Éden. As páginas seguem o modelo comercial enviado.</div></div>`;
}
function menus(){
 const budgets=[...get('menus')].sort((a,b)=>String(b.issued_on||b.created_at||'').localeCompare(String(a.issued_on||a.created_at||'')));
 return `${section('Orçamentos comerciais','Propostas para clientes com cardápio fotográfico e PDF no padrão Éden.',`<button class="btn" data-action="quote-new">＋ Criar orçamento</button>`)}
 <div class="proposal-banner"><div><strong>Do cadastro da receita à proposta para o cliente</strong><p>A receita é interna. O orçamento seleciona pratos, define data, convidados e investimento, e gera o PDF comercial.</p></div><span>Documento personalizado</span></div>
 <div class="recipe-grid">${budgets.map(m=>`<article class="recipe-card proposal-list-card"><div class="kicker">PROPOSTA COMERCIAL · ${dstr(m.issued_on||m.created_at?.slice(0,10))}</div><h3>${esc(m.client_display||label('clients',m.client_id))}</h3><p>${esc(m.service_type||m.name)} · ${num(m.guests)} convidados</p><div class="detail-tile"><small>Investimento proposto</small><strong style="font-size:21px">${proposalPriceDisplay(m)}</strong><small>${m.event_date?'Evento em '+dstr(m.event_date):'Data ainda não definida'}</small></div><footer><button class="btn btn-soft btn-xs" data-action="proposal-open" data-id="${m.id}">Ver proposta / PDF</button><button class="btn btn-outline btn-xs" data-action="proposal-edit" data-id="${m.id}">Editar</button></footer></article>`).join('')||`<div class="panel">${empty('Nenhum orçamento criado. Clique em “Criar orçamento” para começar.')}</div>`}</div>`;
}
function menuCost(menuId){return get('menu_items').filter(x=>x.menu_id===menuId).reduce((s,x)=>s+num(x.portions)*recipeCost(x.recipe_id)/num(one('recipes',x.recipe_id)?.yield_qty||1),0)}
function requiredForMenu(m){let needed=new Map();get('menu_items').filter(x=>x.menu_id===m.id).forEach(item=>{let recipe=one('recipes',item.recipe_id);get('recipe_items').filter(i=>i.recipe_id===item.recipe_id).forEach(i=>needed.set(i.ingredient_id,(needed.get(i.ingredient_id)||0)+num(i.qty)*num(item.portions)/num(recipe?.yield_qty||1)))});return [...needed].map(([id,qty])=>({ingredient:one('ingredients',id),id,qty,stock:stockQty(id),buy:Math.max(0,qty-stockQty(id))})).filter(x=>x.ingredient)}
function stockQty(ingredientId){return Math.round(get('stock_movements').filter(s=>s.ingredient_id===ingredientId).reduce((a,s)=>a+num(s.qty),0)*1000)/1000}
function purchases(){let planned=get('purchases').filter(p=>p.status==='planejada').length;return `${section('Compras & estoque','Planejado não altera caixa nem estoque. Confirmado cria obrigação e entrada.',`${addBtn('purchases','Nova compra')}<button class="btn btn-outline" data-action="open" data-type="stock_movements">＋ Consumo ou ajuste</button>`)}<div class="metrics">${cardmetric('Compras planejadas',planned,'Ainda sem efeito financeiro','◷','purchases')}${cardmetric('Compras confirmadas',get('purchases').length-planned,'Contas a pagar criadas','✓','purchases')}${cardmetric('Itens do catálogo',get('ingredients').length,'Ingredientes cadastrados','♧','ingredients')}${cardmetric('Abaixo do estoque mínimo',get('ingredients').filter(i=>stockQty(i.id)<num(i.min_stock)).length,'Itens exigindo atenção','!','ingredients')}</div><div class="data-wrap"><table class="data"><thead><tr><th>Item / fornecedor</th><th>Evento</th><th>Quantidade</th><th>Custo total</th><th>Data</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${get('purchases').sort((a,b)=>b.purchase_date.localeCompare(a.purchase_date)).map(p=>`<tr><td><strong>${esc(label('ingredients',p.ingredient_id))}</strong><div class="muted">${esc(p.supplier||'—')}</div></td><td>${esc(label('events',p.event_id))}</td><td>${num(p.qty)} ${esc(one('ingredients',p.ingredient_id)?.unit||'')}</td><td>${money(num(p.qty)*num(p.unit_price))}</td><td>${dstr(p.purchase_date)}</td><td>${badge(p.status,p.status==='confirmada'?'ok':'warn')}</td><td>${p.status==='planejada'?`<button class="btn btn-soft btn-xs" data-action="confirm-purchase" data-id="${p.id}">Confirmar compra</button><button class="row-action" data-action="open" data-type="purchases" data-id="${p.id}">Editar</button>`:'Registrada'}</td></tr>`).join('')||`<tr><td colspan="7">${empty('Sem compras planejadas ou confirmadas.')}</td></tr>`}</tbody></table></div>`}
function eventMoney(id){let bills=get('obligations').filter(x=>x.event_id===id&&!x.canceled);let rec=bills.filter(x=>x.kind==='receber'),cost=bills.filter(x=>x.kind==='pagar');return {receivable:rec.reduce((s,b)=>s+num(b.amount),0),received:rec.reduce((s,b)=>s+paid(b),0),payable:cost.reduce((s,b)=>s+num(b.amount),0),spent:cost.reduce((s,b)=>s+paid(b),0)}}
function reports(){let contracted=get('events').reduce((s,e)=>s+num(e.contracted_amount),0);let revenue=movements().filter(x=>x.signed>0).reduce((s,x)=>s+x.signed,0);let cost=-movements().filter(x=>x.signed<0).reduce((s,x)=>s+x.signed,0);let margin=revenue>0?((revenue-cost)/revenue*100):0;let cats={};movements().filter(m=>m.signed<0).forEach(m=>cats[m.category||'geral']=(cats[m.category||'geral']||0)-m.signed);let sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);let max=Math.max(1,...sorted.map(x=>x[1]));return `${section('Relatórios gerenciais','Valores reais são baseados em pagamentos efetivos e não em contratos.',`<button class="btn btn-outline" data-action="export-csv">↓ Exportar CSV financeiro</button>`)}<div class="metrics">${cardmetric('Valor contratado',money(contracted),'Eventos cadastrados','▣','events')}${cardmetric('Recebido real',money(revenue),'Todos os períodos','↓','finance')}${cardmetric('Pago real',money(cost),'Todos os períodos','↑','finance')}${cardmetric('Resultado de caixa',money(revenue-cost),`Proporção: ${margin.toFixed(1)}%`,'↗','finance')}</div><div class="columns-2"><div class="panel"><div class="panel-top"><h3>Saídas por categoria</h3><small>Pagamentos efetivos</small></div>${sorted.length?`<div class="mini-chart">${sorted.map(([cat,value])=>`<div class="mini-chart-row"><span>${esc(cat)}</span><div class="bar"><i style="width:${Math.max(1,value/max*100)}%"></i></div><span class="num">${money(value)}</span></div>`).join('')}</div>`:empty('Sem despesas realizadas')}</div><div class="panel"><div class="panel-top"><h3>Rentabilidade por evento</h3><small>Previsão e efetivo são diferentes</small></div>${get('events').length?get('events').slice(0,8).map(e=>{let fin=eventMoney(e.id);return `<div class="list-row"><div><strong>${esc(e.name)}</strong><span>Contrato ${money(e.contracted_amount)} · Despesas previstas ${money(e.estimated_cost)}</span></div><div class="list-right"><strong>${money(fin.received-fin.spent)}</strong><span>Caixa real do evento</span></div></div>`}).join(''):empty('Sem eventos')}</div></div><div class="test-notice" style="margin-top:22px">Este demonstrativo apresenta resultado de caixa (recebido menos pago), e não DRE ou lucro contábil. A apuração integral de margem por competência, rateios e impostos permanece para uma etapa posterior.</div>`}

function defaultFieldValue(name){if(['event_date','due_date','purchase_date','paid_on','movement_date','transferred_on'].includes(name))return name==='event_date'?'':today();return ({stage:'novo_contato',status:'pendente',kind:'receber',type:'banco',unit:'g',reason:'ajuste',priority:'normal',yield_qty:1,pack_qty:1000,guests:1,portions:1,version:1}[name]??'')}

async function saveRecord(form){
 let type=form.dataset.type,id=form.dataset.id;
 let fields=formFields(type,one(type,id)||{},state.modal?.context||{});
 let fd=new FormData(form),obj={};
 for(let x of fields){let v=fd.get(x.name);if(x.type==='number')v=v===''?null:Number(String(v).replace(',','.'));else if(x.type==='select'&&v==='')v=null;else if(['date','time'].includes(x.type)&&v==='')v=null;obj[x.name]=v}
 if(type==='recipes'&&String(obj.pdf_description||'').length>180)throw Error('A descrição para o PDF pode ter até 180 caracteres.');
 if(type==='recipes'&&(obj.yield_qty===null||obj.yield_qty===''))obj.yield_qty=1; // Banco exige rendimento >0; cálculo mantém base unitária.
 if(type==='events'&&!obj.status)obj.status='confirmado';
 if(type==='purchases'&&!id)obj.status='planejada';
 if(type==='stock_movements'&&num(obj.qty)===0)throw Error('A movimentação precisa ter quantidade diferente de zero');
 if(type==='stock_movements'&&obj.reason==='consumo'&&num(obj.qty)>0)throw Error('Consumo deve ser registrado como quantidade negativa');
 if(type==='stock_movements'&&obj.reason==='perda'&&num(obj.qty)>0)throw Error('Perdas devem usar valores negativos');
 if(type==='transfers'&&obj.from_account===obj.to_account)throw Error('As contas de origem e destino precisam ser diferentes');
 if(type==='obligations'&&!id)obj.canceled=false;
 let uploadedPath=null,oldPath=type==='recipes'?String(one('recipes',id)?.photo_url||''):'';
 if(type==='recipes'){
   if(!RECIPE_TYPES.some(([code])=>code===obj.category))throw Error('Escolha Bebida, Menu doce ou Menu salgado.');
   const file=fd.get('recipe_photo'),remove=fd.get('remove_photo')==='1';
   const hasFile=file instanceof File && file.size>0;
   if(hasFile){
     const processed=await optimizedPhoto(file);
     const recordId=id||makeUUID();
     const path=`receitas/${recordId}/${makeUUID()}.${processed.extension}`;
     const {error:uploadError}=await state.db.storage.from(PHOTO_BUCKET).upload(path,processed.blob,{contentType:processed.mime,cacheControl:'3600',upsert:false});
     if(uploadError)throw Error('Não foi possível salvar a foto no Supabase Storage. Verifique se executou o SQL 03 e as permissões: '+uploadError.message);
     uploadedPath=path;
     if(!id)obj.id=recordId;
     obj.photo_url=path;
   }else if(remove){obj.photo_url=''}
 }
 try{
   const query=id?state.db.from(type).update(obj).eq('id',id):state.db.from(type).insert(obj);
   const {error}=await query;if(error)throw error;
 }catch(error){
   if(uploadedPath){try{await state.db.storage.from(PHOTO_BUCKET).remove([uploadedPath])}catch(e){console.warn('Falha ao limpar foto após erro:',e)}}
   throw error;
 }
 if(type==='recipes'&&(uploadedPath||obj.photo_url==='')&&isStoragePhoto(oldPath)&&oldPath!==uploadedPath){
   try{await state.db.storage.from(PHOTO_BUCKET).remove([oldPath]);photoCache.delete(oldPath)}catch(e){console.warn('Foto anterior não pôde ser removida:',e)}
 }
 let returnModal=type==='recipe_items'?'recipe':type==='menu_items'?'menu':null;
 let returnId=returnModal?(type==='recipe_items'?obj.recipe_id:obj.menu_id):null;
 clearTemporaryPhoto();
 await loadAll();
 if(returnModal)showModal(returnModal,null,returnId);
 else{state.modal=null;render()}
 toast(`${LABELS[type]||'Registro'} ${id?'atualizado':'cadastrado'} com sucesso.`);
}
async function saveSettlement(form){let id=form.dataset.id,b=one('obligations',id);if(!b)throw Error('Conta não encontrada');let fd=new FormData(form);let amount=Number(fd.get('amount'));if(!(amount>0)||amount>remaining(b)+.001)throw Error('O pagamento excede o valor pendente.');const {error}=await state.db.from('settlements').insert({obligation_id:id,account_id:fd.get('account_id'),amount,paid_on:fd.get('paid_on'),method:fd.get('method'),notes:fd.get('notes')});if(error)throw error;await loadAll();state.modal=null;render();toast('Liquidação registrada. Caixa atualizado.')}

async function convertOpportunity(id){let o=one('opportunities',id);if(!o)return;if(!o.event_date)throw Error('Preencha uma data prevista antes de converter.');if(get('events').some(e=>e.opportunity_id===id)){toast('Esta oportunidade já possui evento.',true);return}let {data,error}=await state.db.from('events').insert({client_id:o.client_id,opportunity_id:o.id,name:o.title,event_date:o.event_date,guests:o.guests,service:o.service,contracted_amount:o.estimated_value,status:'confirmado',notes:o.notes}).select('id').single();if(error)throw error;const {error:stageErr}=await state.db.from('opportunities').update({stage:'confirmado'}).eq('id',id);if(stageErr)toast('Evento criado, mas não foi possível atualizar o funil.',true);await loadAll();state.modal=null;render();if(data?.id)showModal('event',null,data.id);toast('Evento criado e conectado ao cliente e à oportunidade.')}
async function generatePurchases(menuId){let m=one('menus',menuId),items=requiredForMenu(m).filter(x=>x.buy>.0001);if(!items.length)throw Error('Não há itens a comprar.');if(!confirm(`Criar ${items.length} compras planejadas para este menu? Nenhuma despesa real será registrada agora.`))return;let rows=items.map(x=>({ingredient_id:x.id,event_id:m.event_id||null,supplier:x.ingredient.supplier||'',qty:Math.ceil(x.buy/num(x.ingredient.pack_qty))*num(x.ingredient.pack_qty),unit_price:num(x.ingredient.pack_price)/num(x.ingredient.pack_qty),purchase_date:today(),status:'planejada',notes:`Projeção a partir do menu: ${m.name}`}));let {error}=await state.db.from('purchases').insert(rows);if(error)throw error;await loadAll();state.modal=null;state.view='purchases';render();toast(`${rows.length} compras planejadas criadas. Ainda não afetam estoque nem caixa.`)}
function downloadCSV(){let rows=[['Data','Tipo','Descrição','Evento','Categoria','Conta','Valor R$'],...movements().sort((a,b)=>a.paid_on.localeCompare(b.paid_on)).map(m=>[dstr(m.paid_on),m.kind,m.description||'',label('events',m.event_id),m.category||'',label('accounts',m.account_id),m.signed.toFixed(2).replace('.',',')])];let csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));let a=document.createElement('a');a.href=url;a.download=`eden_financeiro_${today()}.csv`;a.click();URL.revokeObjectURL(url)}
function proposalPdfName(menu){
 // O nome sugerido para salvar o PDF usa o cliente do próprio orçamento.
 // Remove caracteres que não são aceitos como nome de arquivo no Windows/macOS.
 let client=String(menu?.client_display||label('clients',menu?.client_id)||'').trim();
 if(!client||client==='—')client='Cliente';
 client=client.replace(/[\\/<>:"|?*\x00-\x1F]/g,' - ').replace(/\s+/g,' ').replace(/[. ]+$/g,'').slice(0,100).trim()||'Cliente';
 return `Éden & ${client}`;
}
function printMenu(id){
 let m=one('menus',id);if(!m)return;
 document.getElementById('print-root')?.remove();
 let div=document.createElement('div');div.id='print-root';div.innerHTML=proposalPagesHTML(m);document.body.append(div);
 // Navegadores normalmente usam o título temporário ao sugerir o nome do PDF.
 // Sem ".pdf" aqui para o navegador adicionar a extensão apenas uma vez.
 const previousTitle=document.title;
 document.title=proposalPdfName(m);
 let restored=false;
 const finish=()=>{
   if(restored)return;
   restored=true;
   document.title=previousTitle;
   div.remove();
 };
 window.addEventListener('afterprint',finish,{once:true});
 try{window.print()}catch(error){finish();throw error}
 setTimeout(finish,300000);
}

document.addEventListener('dragstart',e=>{let card=e.target.closest('[data-drag-id]');if(card&&e.dataTransfer){e.dataTransfer.setData('text/plain',card.dataset.dragId);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{let lane=e.target.closest('[data-drop-stage]');if(lane){e.preventDefault();lane.classList.add('drag-over')}});
document.addEventListener('dragleave',e=>{let lane=e.target.closest('[data-drop-stage]');if(lane&&!lane.contains(e.relatedTarget))lane.classList.remove('drag-over')});
document.addEventListener('drop',async e=>{let lane=e.target.closest('[data-drop-stage]');if(!lane)return;e.preventDefault();lane.classList.remove('drag-over');let id=e.dataTransfer?.getData('text/plain');if(!id)return;try{await updateRow('opportunities',id,{stage:lane.dataset.dropStage});toast('Etapa da oportunidade atualizada.')}catch(err){toast(errorMessage(err),true)}});
document.addEventListener('submit',async e=>{let form=e.target;if(!['auth-form','record-form','settle-form','password-form','quote-form'].includes(form.id))return;e.preventDefault();if(form.dataset.busy==='1')return;form.dataset.busy='1';let submits=[...form.querySelectorAll('button[type="submit"],button:not([type])')];submits.forEach(b=>b.disabled=true);
try{if(form.id==='auth-form'){
 const fd=new FormData(form),email=String(fd.get('email')||'').trim(),password=String(fd.get('password')||'');
 const {data,error}=await state.db.auth.signInWithPassword({email,password});
 if(error)throw error;
 if(!data?.user)throw Error('Login não concluído. Confira seu e-mail e senha.');
 await authorizeAndLoad(data.user);
 return;
}
if(form.id==='password-form'){
 const fd=new FormData(form),password=String(fd.get('password')||'');
 if(password.length<12||password!==String(fd.get('confirm')||''))throw Error('As senhas devem ser iguais e ter pelo menos 12 caracteres.');
 const {error}=await state.db.auth.updateUser({password});
 if(error)throw error;
 state.modal=null;render();toast('Sua senha foi atualizada. Não a compartilhe.');return;
}
if(form.id==='record-form')await saveRecord(form);
if(form.id==='quote-form')await saveQuote(form);
if(form.id==='settle-form')await saveSettlement(form)
}catch(err){toast(errorMessage(err),true)}finally{if(form.isConnected){form.dataset.busy='0';submits.forEach(b=>b.disabled=false)}}});
init();

  
  </script>
</body>
</html>
